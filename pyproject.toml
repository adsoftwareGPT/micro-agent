[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micro-agent"
version = "0.1.0"
description = "Tiny terminal AI agent that drives a real Chromium browser over CDP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "adsoftware" }]
keywords = ["ai", "agent", "cli", "browser", "cdp", "llm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "requests",
    "pillow",
]

[project.optional-dependencies]
# DuckDuckGo web search — optional since not all users need search and `ddgs`
# is not packaged in Debian apt (only on PyPI).
search = ["ddgs"]

[project.scripts]
# Creates a `micro-agent` command on PATH that calls micro.main()
micro-agent = "micro:main"

[project.urls]
Homepage = "https://github.com/adsoftwareGPT/micro-agent"
Repository = "https://github.com/adsoftwareGPT/micro-agent"
Issues = "https://github.com/adsoftwareGPT/micro-agent/issues"

# ── Packaging: ship the 3 sibling modules as flat top-level modules ──────────
# cdp_fetch and browser_action are imported by micro.py as top-level siblings
# (e.g. `from cdp_fetch import fetch_webpage`), so they must be installed as
# flat modules, not nested under a package.
[tool.hatch.build.targets.wheel]
packages = ["micro.py", "cdp_fetch.py", "browser_action.py"]

[tool.hatch.build.targets.sdist]
include = [
    "micro.py",
    "cdp_fetch.py",
    "browser_action.py",
    ".env.example",
    "README.md",
    "LICENSE",
    "build-deb.sh",
]

# ── Linting (ruff) ─────────────────────────────────────────────────────────
# This project talks to external APIs, drives a browser, and launches
# subprocesses, so it deliberately swallows broad exceptions and reads module
# globals for convenience. The rule ignores below reflect that style rather
# than discouraging it:
#   BLE001  blind `except Exception`     — deliberate resilience
#   S110    `try/except` that just `pass`— deliberate best-effort calls
#   S112    `try/except` with `continue` — deliberate best-effort loops
#   PLW0602 `global` for read-only access— harmless module-global reads
#   SIM105  suppressible exception        — best-effort cleanup is intended
# Line length / wrapping is owned by `ruff format`, so E501 is excluded here.
[tool.ruff]
line-length = 120
target-version = "py310"
include = ["micro.py", "cdp_fetch.py", "browser_action.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["BLE001", "S110", "S112", "PLW0602", "SIM105"]
